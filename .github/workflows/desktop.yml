# BillBook Desktop CI - build, SMOKE-TEST, and publish the signed Tauri
# shell for Windows, fully automated.
#
# ──────────────────────────────────────────────────────────────────────
# HOW TO CUT A RELEASE (one button, no git commands needed):
#   Actions tab -> "Desktop Build" -> "Run workflow" -> type the
#   version (e.g. 8.17.13), pick a packer (default: pyinstaller) ->
#   "Run workflow".
#   The workflow bumps desktop/tauri.conf.json AND desktop/Cargo.toml,
#   commits, tags v8.17.13, builds, smoke-tests, signs and publishes
#   the GitHub Release automatically. Nothing else to do.
#
#   Leave the version field EMPTY for a plain CI build: builds and
#   smoke-tests everything, publishes nothing.
#
#   (Manually pushing a tag still works exactly as before:
#      git tag v8.17.14 && git push origin v8.17.14 )
#
# ──────────────────────────────────────────────────────────────────────
# BUILD TIME (Windows runner, pip + Rust caches warm):
#   app code changed (PyInstaller sidecar):   ~10-12 min
#   shell-only change (sidecar cache HIT):    ~7-9 min
#     - skips pip install AND the sidecar build entirely
#   packer: nuitka (special releases):        ~20-25 min
#   (Historical baseline with Nuitka always:  ~23-25 min)
#
# The three time levers:
#   1. PyInstaller sidecar by default: 12-14 min -> 2-4 min.
#      Nuitka remains available via the `packer` workflow input.
#   2. Sidecar cache keyed on the hash of app/** + requirements.txt:
#      releases that only touch the shell (main.rs, tauri.conf.json)
#      skip the entire Python toolchain + sidecar build.
#   3. pip cache + polls instead of fixed sleeps in smoke tests.
#
# WHAT EACH SAFEGUARD PROTECTS AGAINST (all lessons from real incidents):
#   - Version guard runs BEFORE the build - a mismatch fails in ~40
#     seconds, not after a 25-minute build (the v8.17.10 dead-tag).
#   - Sidecar smoke test - the Python backend must print
#     BILLBOOK_READY before the expensive Tauri build runs.
#   - App smoke test - the built exe must START, spawn its sidecar and
#     reach "backend ready on port". v8.17.9-8.17.11 shipped to users
#     with a startup panic because CI built the app but never once RAN
#     it. If this ever fails ONLY due to runner-specific WebView2
#     quirks, add  continue-on-error: true  to that step.
#   - latest.json validation - the updater manifest is structurally
#     checked before going live (wrong version/url = dead updater).
#   - Smoke-evidence artifact on failure - sidecar logs + desktop.log
#     from the runner are uploaded for debugging.
#   - Concurrency - re-pushing the same tag cancels the old run.
#
# RELEASE ARTIFACTS (the three files the auto-updater needs):
#   1. BillBook_x.y.z_x64-setup.exe      (NSIS installer)
#   2. BillBook_x.y.z_x64-setup.exe.sig  (minisign signature)
#   3. latest.json                       (updater manifest)
#
# NOTES:
#   - The repo must stay PUBLIC for anonymous updater downloads: on
#     private repos, release asset URLs return 404 without auth and the
#     Tauri updater cannot authenticate.
#   - macOS build stays manual-only (plain CI runs; never releases,
#     bundle.targets is nsis-only anyway).

name: Desktop Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to RELEASE (e.g. 8.17.13). Leave EMPTY for a CI-only build that publishes nothing.'
        required: false
        default: ''
      packer:
        description: 'Sidecar packer: pyinstaller (~3 min, default) or nuitka (~15 min, C-compiled)'
        type: choice
        options: [pyinstaller, nuitka]
        default: pyinstaller

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── One-button release: bump versions, commit, tag, push ──────────
  # Runs only when "Run workflow" was clicked WITH a version. The build
  # job below then builds that exact tag within THIS run - pushes made
  # with GITHUB_TOKEN do not trigger other workflow runs, which is why
  # the tag job and the build live in the same workflow.
  prepare-release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version and bump both files
        id: ver
        run: |
          V="${{ github.event.inputs.version }}"
          V="${V#v}"
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$V' is not a plain x.y.z version like 8.17.13"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "::error::Tag v$V already exists - pick a fresh version."
            exit 1
          fi
          python3 - "$V" <<'PYEOF'
          import json, re, sys
          v = sys.argv[1]
          conf_p = 'desktop/tauri.conf.json'
          conf = json.loads(open(conf_p, encoding='utf-8-sig').read())
          cur = conf['version']
          def key(s): return tuple(int(x) for x in s.split('.'))
          if key(v) <= key(cur):
              print(f"::error::v{v} is not higher than current version {cur} - the updater only moves forward.")
              sys.exit(1)
          conf['version'] = v
          open(conf_p, 'w', encoding='utf-8').write(json.dumps(conf, indent=2) + '\n')
          cargo_p = 'desktop/Cargo.toml'
          raw = open(cargo_p, encoding='utf-8').read()
          raw2, n = re.subn(r'(?m)^version\s*=\s*"[^"]*"', f'version = "{v}"', raw, count=1)
          assert n == 1, 'Cargo.toml: version line not found'
          open(cargo_p, 'w', encoding='utf-8').write(raw2)
          print(f"Bumped tauri.conf.json + Cargo.toml: {cur} -> {v}")
          PYEOF
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      - name: Commit, tag and push (the build continues in this run)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/tauri.conf.json desktop/Cargo.toml
          git commit -m "release: v${{ steps.ver.outputs.version }} [skip ci]"
          git tag "v${{ steps.ver.outputs.version }}"
          git push origin master "refs/tags/v${{ steps.ver.outputs.version }}"

      - name: Release kicked off
        run: |
          echo "### Release v${{ steps.ver.outputs.version }} is building" >> "$GITHUB_STEP_SUMMARY"
          echo "Build + smoke tests + signing takes ~10 min (pyinstaller) / ~25 min (nuitka)." >> "$GITHUB_STEP_SUMMARY"
          echo "The release appears automatically at:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases" >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    needs: prepare-release
    if: always() && !cancelled() && needs.prepare-release.result != 'failure'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # The tag being released (empty = plain CI build, nothing published).
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
      # Sidecar packer: pyinstaller (fast, default) or nuitka (thorough).
      PACKER: ${{ github.event.inputs.packer || 'pyinstaller' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # On one-button releases, build the exact commit the prepare
          # job just tagged - NOT the master sha the run started from.
          ref: ${{ needs.prepare-release.outputs.tag || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # sqlcipher3-binary has cp311 wheels; NOT 3.14
          cache: 'pip'             # warm wheel cache: the 4-min pip step drops to <1 min

      - name: Guard - version must match the tag (BEFORE the long build)
        shell: bash
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "CI-only build (nothing will be published) - version guard skipped."
            exit 0
          fi
          EXPECTED="${RELEASE_TAG#v}"
          ACTUAL=$(python -c "import json;print(json.load(open('desktop/tauri.conf.json', encoding='utf-8-sig'))['version'])")
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Tag $RELEASE_TAG does not match version $ACTUAL in desktop/tauri.conf.json. Bump the version first, then tag v$ACTUAL."
            exit 1
          fi
          echo "Version OK: $ACTUAL"

      # ── Sidecar cache ────────────────────────────────────────────────
      # Shell-only releases (main.rs / tauri.conf.json changes) rebuild
      # nothing: the 95 MB sidecar is restored from cache and the pip
      # install + packer build steps below are skipped entirely.
      # No restore-keys on purpose: a partial/stale restore would ship
      # old Python code. Exact hit or full rebuild, never in between.
      - name: Cache sidecar binary
        id: sidecar-cache
        uses: actions/cache@v4
        with:
          path: dist/billbook_sidecar.exe
          key: sidecar-Windows-py311-${{ env.PACKER }}-${{ hashFiles('app/**', 'requirements.txt', 'scripts/build_sidecar.sh') }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Python deps (skipped when sidecar cache hit)
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pip install -r requirements.txt pyinstaller
          if [ "${{ env.PACKER }}" = "nuitka" ]; then pip install nuitka; fi

      - name: Build sidecar (skipped when sidecar cache hit)
        if: steps.sidecar-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/build_sidecar.sh

      - name: Sidecar cache hit - reusing cached binary
        if: steps.sidecar-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          ls -la dist/
          echo "Sidecar restored from cache - skipped pip install + $PACKER build (~6-18 min saved)."

      # ── Smoke test 1: the backend must actually start ───────────────
      # Catches missing imports, broken migrations and packaging
      # mistakes BEFORE the expensive Tauri build. ~30-60s. Also runs
      # on cache hits - validates the restored binary on a fresh runner.
      - name: Smoke test - sidecar must reach BILLBOOK_READY
        shell: pwsh
        run: |
          $env:PYTHONUNBUFFERED = '1'
          $p = Start-Process "dist/billbook_sidecar.exe" -PassThru -RedirectStandardOutput sidecar_out.log -RedirectStandardError sidecar_err.log
          $deadline = (Get-Date).AddSeconds(90)
          $ready = $false
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            if ((Test-Path sidecar_out.log) -and (Select-String -Path sidecar_out.log -Pattern 'BILLBOOK_READY' -Quiet)) { $ready = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $p.HasExited) { taskkill /F /T /PID $($p.Id) | Out-Null }
          Get-Process billbook_sidecar* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          "---- sidecar stdout (tail) ----"
          if (Test-Path sidecar_out.log) { Get-Content sidecar_out.log -Tail 25 }
          "---- sidecar stderr (tail) ----"
          if (Test-Path sidecar_err.log) { Get-Content sidecar_err.log -Tail 25 }
          if (-not $ready) {
            throw "sidecar never printed BILLBOOK_READY within 90 seconds - see output above. NOT SAFE TO RELEASE."
          }
          "SIDE CAR SMOKE TEST PASSED"

      - name: Copy sidecar to Tauri binaries
        shell: bash
        run: |
          mkdir -p desktop/binaries
          cp dist/billbook_sidecar.exe desktop/binaries/billbook_sidecar-x86_64-pc-windows-msvc.exe

      - name: Install Tauri CLI (npm prebuilt binary, ~10s vs ~10min for cargo install)
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app (signed with the repo secret)
        working-directory: desktop
        run: tauri build
        env:
          # The secrets must hold the private key CONTENTS, not a path.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Fail loudly if the bundle was not signed
        shell: bash
        run: |
          shopt -s nullglob
          sigs=(desktop/target/release/bundle/nsis/*-setup.exe.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "::error::No .sig file was produced - signing failed. Check the TAURI_SIGNING_PRIVATE_KEY secret (paste the key CONTENTS, not a path) and, if the key has a password, add TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          fi
          echo "Signed bundle: ${sigs[0]}"

      # ── Smoke test 2: the built app must actually START ─────────────
      # v8.17.9-8.17.11 shipped to users with a startup panic (bad
      # plugin config) because CI built the app but never RAN it once.
      # This launches the real exe on the runner and polls desktop.log
      # (typically ready in ~20-40s; 90s hard timeout) requiring:
      #   1. the process stays alive (no startup panic), and
      #   2. desktop.log shows "backend ready on port" - sidecar spawned
      #      and health handshake completed, exactly like a user machine.
      # Escape hatch: if this ever fails ONLY due to runner-specific
      # WebView2 issues, add  continue-on-error: true  to this step.
      - name: Smoke test - the built app must start (the v8.17.9 lesson)
        shell: pwsh
        run: |
          $exe = "desktop/target/release/billbook-desktop.exe"
          if (-not (Test-Path $exe)) { throw "built exe not found at $exe" }
          Remove-Item "$env:APPDATA\com.billbook.app\logs\desktop.log" -Force -ErrorAction SilentlyContinue
          $log = "$env:APPDATA\com.billbook.app\logs\desktop.log"
          $p = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(90)
          $ready = $false
          while ((Get-Date) -lt $deadline) {
            if ($p.HasExited) {
              if (Test-Path $log) { "---- desktop.log ----"; Get-Content $log -Tail 40 }
              throw "billbook-desktop.exe EXITED during startup with code $($p.ExitCode) - the app is broken. DO NOT RELEASE."
            }
            if ((Test-Path $log) -and (Select-String -Path $log -Pattern 'backend ready on port \d+' -Quiet)) { $ready = $true; break }
            Start-Sleep -Seconds 3
          }
          if (-not $ready) {
            if (Test-Path $log) { "---- desktop.log ----"; Get-Content $log -Tail 40 }
            taskkill /F /T /PID $($p.Id) | Out-Null
            throw "backend did not reach ready state within 90 seconds - see desktop.log above."
          }
          $secs = [math]::Round(((Get-Date)-$p.StartTime).TotalSeconds,0)
          "SMOKE TEST PASSED - app started and backend became ready in ~${secs}s:"
          Get-Content $log -Tail 12
          taskkill /F /T /PID $($p.Id) | Out-Null
          Get-Process billbook* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Generate latest.json (updater manifest)
        shell: bash
        run: |
          NOTES="BillBook ${RELEASE_TAG#v}"
          if [ -z "$RELEASE_TAG" ]; then NOTES="CI build (not released)"; fi
          python build/windows/make_latest_json.py \
            --base-url "https://github.com/${{ github.repository }}/releases/download" \
            --notes "$NOTES"

      - name: Validate latest.json (a broken manifest kills the updater)
        shell: bash
        run: |
          python - <<'EOF'
          import json
          m = json.load(open('build/updater/latest.json'))
          v = json.load(open('desktop/tauri.conf.json', encoding='utf-8-sig'))['version']
          assert m['version'] == v, f"latest.json version {m['version']} != tauri.conf.json {v}"
          p = m['platforms']['windows-x86_64']
          assert p['signature'].startswith('dW50cnVzdGVkIGNvbW1lbnQ'), 'signature does not look like minisign output'
          assert p['url'].endswith(f'BillBook_{v}_x64-setup.exe'), f"unexpected url: {p['url']}"
          print(f"latest.json OK: v{v} -> {p['url']}")
          EOF

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p build/updater
          cp desktop/target/release/bundle/nsis/*-setup.exe build/updater/
          cp desktop/target/release/bundle/nsis/*-setup.exe.sig build/updater/
          ls -la build/updater

      - name: Upload build artifacts (for inspection / manual publishing)
        uses: actions/upload-artifact@v4
        with:
          name: billbook-windows
          path: build/updater/*
          retention-days: 14

      - name: Collect smoke-test evidence (on failure)
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path smoke-evidence | Out-Null
          foreach ($f in @('sidecar_out.log','sidecar_err.log')) {
            if (Test-Path $f) { Copy-Item $f smoke-evidence/ }
          }
          $log = "$env:APPDATA\com.billbook.app\logs\desktop.log"
          if (Test-Path $log) { Copy-Item $log smoke-evidence/ }

      - name: Upload smoke-test evidence (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-evidence
          path: smoke-evidence/*
          retention-days: 14

      - name: Create GitHub Release (one-button releases and tag pushes)
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            build/updater/*-setup.exe
            build/updater/*-setup.exe.sig
            build/updater/latest.json

  # Manual-only macOS build (plain CI runs only - never releases, and
  # never runs on one-button releases; bundle.targets is nsis anyway).
  build-macos:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.version == ''
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Python deps
        run: |
          pip install -r requirements.txt pyinstaller nuitka

      - name: Build sidecar
        run: bash scripts/build_sidecar.sh

      - name: Copy sidecar to Tauri binaries
        run: |
          mkdir -p desktop/binaries
          cp dist/billbook_sidecar desktop/binaries/billbook_sidecar-x86_64-apple-darwin

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app
        working-directory: desktop
        run: tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
