# BillBook Desktop CI — builds Tauri shell + sidecar for Windows + macOS
# NOTE: If repo is private, macOS minutes burn 10x. Recommend making repo public
# for unlimited free minutes. Document this trade-off in the release guide.

name: Desktop Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install nuitka pyinstaller

      - name: Build sidecar
        run: bash scripts/build_sidecar.sh
        shell: bash

      - name: Copy sidecar to Tauri binaries
        run: |
          mkdir -p desktop/binaries
          cp dist/billbook_sidecar.exe desktop/binaries/billbook_sidecar-x86_64-pc-windows-msvc.exe

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Tauri app
        working-directory: desktop
        run: cargo tauri build
        env:
          # v8.14.2 FIX: Tauri v2 CLI reads TAURI_SIGNING_PRIVATE_KEY / _PASSWORD
          # (the old TAURI_PRIVATE_KEY / TAURI_KEY_PASSWORD names were silently
          # ignored, so update bundles were built UNSIGNED and the updater
          # rejected them). Set these as repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: billbook-windows
          path: desktop/target/release/bundle/nsis/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install nuitka pyinstaller

      - name: Build sidecar
        run: bash scripts/build_sidecar.sh

      - name: Copy sidecar to Tauri binaries
        run: |
          mkdir -p desktop/binaries
          cp dist/billbook_sidecar desktop/binaries/billbook_sidecar-x86_64-apple-darwin

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Tauri app
        working-directory: desktop
        run: cargo tauri build
        env:
          # v8.14.2 FIX: correct Tauri v2 signing env var names (see windows job)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: billbook-macos
          path: desktop/target/release/bundle/dmg/*.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            billbook-windows/*.exe
            billbook-macos/*.dmg
