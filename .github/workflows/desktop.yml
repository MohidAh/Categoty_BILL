# BillBook Desktop CI - builds the signed Tauri shell for Windows and
# publishes a self-updating GitHub Release.
#
# PRODUCTION RELEASE (the only command you need day-to-day):
#   git tag v8.15.1 && git push origin v8.15.1
#
# The release step attaches the THREE files the auto-updater needs:
#   1. BillBook_x.y.z_x64-setup.exe       (NSIS installer)
#   2. BillBook_x.y.z_x64-setup.exe.sig   (its minisign signature)
#   3. latest.json                        (updater manifest, generated by
#      build/windows/make_latest_json.py from the .sig file content)
#
# v8.15.1 FIX: the old workflow uploaded ONLY the .exe. The updater
# endpoint (releases/latest/download/latest.json) returned 404 and
# auto-update never triggered on any client. The .sig + latest.json
# are REQUIRED for the updater chain to work.
#
# NOTES:
#   - The repo must be PUBLIC for anonymous updater downloads: on private
#     repos, release asset URLs return 404 without authentication, and the
#     Tauri updater cannot authenticate. If the repo must stay private,
#     latest.json + installers must be hosted on a public static host
#     instead (see TAURI_AUTO_UPDATE_GUIDE.md section 3.3).
#   - macOS build is manual-only (workflow_dispatch): 10x minute cost on
#     private repos, and bundle.targets only lists nsis anyway.
#   - workflow_dispatch runs build everything but publish NOTHING - use it
#     to smoke-test signing without cutting a release.

name: Desktop Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # sqlcipher3-binary has cp311 wheels; NOT 3.14

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install nuitka pyinstaller

      - name: Build sidecar
        shell: bash
        run: bash scripts/build_sidecar.sh

      - name: Copy sidecar to Tauri binaries
        shell: bash
        run: |
          mkdir -p desktop/binaries
          cp dist/billbook_sidecar.exe desktop/binaries/billbook_sidecar-x86_64-pc-windows-msvc.exe

      - name: Install Tauri CLI (npm prebuilt binary, ~10s vs ~10min for cargo install)
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app (signed with the repo secret)
        working-directory: desktop
        run: tauri build
        env:
          # v8.14.2 FIX: Tauri v2 CLI reads TAURI_SIGNING_PRIVATE_KEY /
          # _PASSWORD (the old TAURI_PRIVATE_KEY names were silently ignored,
          # so bundles were built unsigned and the updater rejected them).
          # The secret must hold the private key CONTENTS, not a file path.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Fail loudly if the bundle was not signed
        shell: bash
        run: |
          shopt -s nullglob
          sigs=(desktop/target/release/bundle/nsis/*-setup.exe.sig)
          if [ ${#sigs[@]} -eq 0 ]; then
            echo "::error::No .sig file was produced - signing failed. Check the TAURI_SIGNING_PRIVATE_KEY secret (paste the key CONTENTS, not a path) and, if the key has a password, add TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
            exit 1
          fi
          echo "Signed bundle: ${sigs[0]}"

      - name: Guard - tag must match tauri.conf.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(python -c "import json;print(json.load(open('desktop/tauri.conf.json', encoding='utf-8-sig'))['version'])")
          if [ "v$VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag '${{ github.ref_name }}' does not match version $VERSION in desktop/tauri.conf.json. Bump the version first, then tag v$VERSION."
            exit 1
          fi

      - name: Generate latest.json (updater manifest)
        shell: bash
        run: |
          python build/windows/make_latest_json.py \
            --base-url "https://github.com/${{ github.repository }}/releases/download" \
            --notes "BillBook ${{ github.ref_name }}"

      - name: Stage release artifacts
        shell: bash
        run: |
          mkdir -p build/updater
          cp desktop/target/release/bundle/nsis/*-setup.exe build/updater/
          cp desktop/target/release/bundle/nsis/*-setup.exe.sig build/updater/
          ls -la build/updater

      - name: Upload build artifacts (for inspection / manual publishing)
        uses: actions/upload-artifact@v4
        with:
          name: billbook-windows
          path: build/updater/*

      - name: Create GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/updater/*-setup.exe
            build/updater/*-setup.exe.sig
            build/updater/latest.json

  # Manual-only macOS build (Actions tab -> Run workflow). Deliberately NOT
  # part of the release chain: bundle.targets only lists nsis (no dmg would
  # be produced), and private repos burn macOS minutes at 10x.
  build-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install nuitka pyinstaller

      - name: Build sidecar
        run: bash scripts/build_sidecar.sh

      - name: Copy sidecar to Tauri binaries
        run: |
          mkdir -p desktop/binaries
          cp dist/billbook_sidecar desktop/binaries/billbook_sidecar-x86_64-apple-darwin

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Build Tauri app
        working-directory: desktop
        run: tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
