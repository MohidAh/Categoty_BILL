<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BillBook — Google Drive Connected</title>
<link rel="stylesheet" href="/static/styles/base.css">
<link rel="stylesheet" href="/static/styles/components.css">
<link rel="stylesheet" href="/static/styles/layout.css">
<style>
  body {
    margin: 0; font-family: var(--font-sans); background: var(--bg);
    color: var(--text); min-height: 100vh; display: grid;
    place-items: center; padding: 20px; -webkit-font-smoothing: antialiased;
  }
  .cb-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-card); padding: 32px; width: 100%;
    max-width: 420px; box-shadow: var(--shadow-lg); text-align: center;
  }
  .cb-logo {
    width: 48px; height: 48px; margin: 0 auto 16px;
    background: var(--success, #10b981); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .cb-logo.error { background: var(--danger, #ef4444); }
  .cb-logo svg { width: 26px; height: 26px; color: white; }
  h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .cb-sub { color: var(--text-2); font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
  .cb-btn {
    display: inline-block; padding: 10px 18px; background: var(--primary);
    color: white; border: 1px solid var(--primary); border-radius: var(--radius-control);
    font-weight: 600; font-size: 14px; text-decoration: none; cursor: pointer;
  }
  .cb-btn:hover { background: var(--primary-hover); }
  /* If success, auto-close after a moment */
  .cb-close-hint { color: var(--text-2); font-size: 11px; margin-top: 16px; }
</style></head><body>
<div class="cb-card">
  <div class="cb-logo" id="cb-logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
  </div>
  <h1 id="cb-title">Google Drive connected</h1>
  <p class="cb-sub" id="cb-sub">
    Your encrypted BillBook backups will be uploaded to your Google Drive
    at the time you chose. You can change the schedule or disconnect
    anytime in <strong>Settings &rarr; Cloud Backup</strong>.
  </p>
  <a class="cb-btn" href="/" id="cb-btn">Open BillBook</a>
  <div class="cb-close-hint" id="cb-hint">You can close this tab.</div>
</div>
<script>
// v8.14.2: status=ok from the OAuth GET callback → Drive is connected.
// status=error means Google rejected the consent (user cancelled, or the
// code exchange failed). Show the right message + try to auto-close.
(function() {
  var params = new URLSearchParams(window.location.search);
  var status = params.get('status') || 'ok';
  var reason = params.get('reason') || '';
  var logo = document.getElementById('cb-logo');
  var title = document.getElementById('cb-title');
  var sub = document.getElementById('cb-sub');
  var btn = document.getElementById('cb-btn');
  var hint = document.getElementById('cb-hint');
  if (status === 'ok') {
    setTimeout(function() {
      try { window.close(); } catch (e) {}
    }, 2500);
  } else {
    logo.classList.add('error');
    logo.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    title.textContent = 'Google Drive not connected';
    sub.innerHTML = 'The OAuth flow did not complete.'
      + (reason ? '<br><code>' + reason + '</code>' : '')
      + '<br>You can try again from <strong>Settings &rarr; Cloud Backup</strong>.';
    btn.textContent = 'Back to BillBook';
    hint.textContent = 'You can close this tab.';
  }
})();
</script></body></html>
