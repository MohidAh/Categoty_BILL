<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BillBook — Starting…</title>
<style>
  /* v8.18.0: desktop splash — the Tauri webview opens THIS file first
     (tauri.conf.json app.windows[].url = "loading.html"). It is fully
     self-contained: no external fonts, no CDN. The Rust shell navigates
     the window to the live backend the moment the sidecar prints
     BILLBOOK_READY — this page only needs to look good for those 2-4
     seconds (previously: a blank white window).
     v8.19: colors now flow through the SAME design tokens as the app
     (--canvas/--ink/--coral/…). Defaults below replicate the old cream
     splash for first paint (and OS-dark users via prefers-color-scheme);
     js/splash-theme.js then applies the saved color scheme (injected by
     the Rust shell from data/appearance.json — this tauri.localhost page
     cannot reach the backend or its localStorage before the server is
     up). Keep this page script-src-'self' safe: only external scripts,
     never inline. */
  :root {
    /* first-paint defaults (pre-scheme) — the old cream splash */
    --canvas: #faf9f5;
    --ink: #201f1d;
    --body: #3d3d3a;
    --muted: #8e8b82;
    --muted-soft: #b3afa5;
    --coral: #cc785c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #181715;
      --ink: #faf9f5;
      --body: #d4cfc4;
      --muted: #a09d96;
      --muted-soft: #6f6c64;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--canvas);
    color: var(--body);
    font-family: Georgia, 'Times New Roman', serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; padding: 24px; }
  .logo {
    font-size: 40px;
    font-weight: 600;
    letter-spacing: -0.5px;
    color: var(--ink);
  }
  .logo .dot { color: var(--coral); }
  .spinner {
    width: 30px;
    height: 30px;
    margin: 26px auto 0;
    border: 3px solid var(--coral);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .status {
    margin-top: 16px;
    font-size: 14px;
    color: var(--muted);
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  }
  .hint {
    margin-top: 34px;
    font-size: 12px;
    color: var(--muted-soft);
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    max-width: 340px;
    line-height: 1.5;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">BillBook<span class="dot">.</span></div>
    <div class="spinner"></div>
    <div class="status" id="status">Starting BillBook…</div>
    <div class="hint">First launch after an install or update can take a few
      extra seconds while the local server warms up.</div>
  </div>
  <!-- v8.19: applies the saved color scheme. Payload arrives either from
       the Rust shell (window.__splashScheme — see desktop/src/main.rs) or,
       when this page is opened from the backend origin (dev mode), from
       localStorage. External module — CSP allows 'self' scripts only. -->
  <script type="module" src="js/splash-theme.js"></script>
</body>
</html>
