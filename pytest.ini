# BillBook pytest configuration
# Phase 0 PR 8: establishes baseline pytest config (previously zero config existed).
# Worklog reviewer (task 6-test) noted this was missing.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# CLI defaults
addopts = -q --tb=short

# Filter out noisy warnings from third-party deps, but DON'T silence
# all DeprecationWarnings (worklog reviewer cautioned against this).
# Add specific filters as needed.
filterwarnings =
    ignore::DeprecationWarning:pkg_resources.*
    ignore::DeprecationWarning:dbfread.*

# Markers (register so pytest doesn't warn about unknown marks)
markers =
    slow: marks tests as slow (deselect with -m "not slow")
    e2e: end-to-end tests that boot a real uvicorn server
    integration: integration tests that touch multiple subsystems

# Logging — show short log lines on failure
log_cli = false
log_cli_level = WARNING
